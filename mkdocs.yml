site_name: "Stack Documentation"

theme:
  name: material

  palette:
    - scheme: default
      primary: blue
      accent: blue

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.instant
    - navigation.tracking
    - content.code.copy

extra_css:
  - stylesheets/default.css


plugins:
  - macros
  - search
  
extra:
  domain: comp.local
  litellm_url: https://litellm.devaiclarity.hu/  
  litellm_url_ui: https://litellm.devaiclarity.hu/ui/
  openwebui_url: https://openwebui.devaiclarity.hu/
  passwd_url : https://passwd.devaiclarity.hu/
  grafana_dev_url : https://grafana.devaiclarity.hu/
  grafana_prod_url : https://grafana.aiclarity.hu/
  nexus_url: https://aiclarity.hu:8443/
  nexus_url_without_https: aiclarity.hu:8443
  
  host_file_openwebui : 172.28.10.13 openwebui.devaiclarity.hu
  host_file_ldapadmin : 172.28.10.13 ldapadmin.devaiclarity.hu
  host_file_litellm : 172.28.10.13 litellm.devaiclarity.hu
  host_file_traefik : 172.28.10.13 traefik.devaiclarity.hu
  host_file_ssoai : 172.28.10.13 ssoai.devaiclarity.hu
  host_file_grafana : 172.28.10.13 grafana.devaiclarity.hu
  host_file_passwd : 172.28.10.13 passwd.devaiclarity.hu
  host_file_vault : 172.28.10.13 vault.devaiclarity.hu
  host_file_docs : 172.28.10.13 docs.aiclarity.hu
  host_file_nexus : 172.28.10.13 aiclarity.hu
  
markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.tasklist
  - pymdownx.superfences

